<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: el contenido se dibuja también bajo el notch, la barra de Safari y la barra de inicio -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Invest Tracker</title>

    <!-- PWA / iOS -->
    <link rel="manifest" href="/invest-tracker/manifest.json" />
    <link rel="apple-touch-icon" href="/invest-tracker/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvestTracker" />
    <meta name="theme-color" content="#090d16" />

    <style id="app-layout">
      /*
       * Buena práctica iOS: dejar que haga scroll el DOCUMENTO (no un div interno).
       * Así Safari dibuja el contenido bajo sus barras translúcidas y en modo app
       * la página ocupa toda la pantalla, incluida la zona de la barra de inicio.
       */
      html {
        background-color: #090d16;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #090d16;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100lvh;
        box-sizing: border-box;
        /* Área segura superior y laterales; la inferior la añade el final del contenido */
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* En modo app no hay "rebote" de página (lo sustituye el tirar para refrescar propio) */
      @media (display-mode: standalone) {
        html,
        body {
          overscroll-behavior-y: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
