<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: la web ocupa toda la pantalla, incluida la zona del notch y de la barra de inicio -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Invest Tracker</title>

    <!-- PWA / iOS -->
    <link rel="manifest" href="/invest-tracker/manifest.json" />
    <link rel="apple-touch-icon" href="/invest-tracker/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvestTracker" />
    <meta name="theme-color" content="#090d16" />

    <style id="app-layout">
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      /* Body fijo a pantalla completa: el scroll lo hace el ScrollView interno */
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      /*
       * Altura real de la pantalla. Se usa --app-height (calculada por JS)
       * porque en la PWA de iOS 100% / 100vh a veces se queda corto por abajo.
       * 100lvh es el fallback CSS (viewport "grande", sin barras).
       */
      #root {
        position: absolute;
        inset: 0;
        display: flex;
        box-sizing: border-box;
        background-color: #090d16;
        /* Área segura arriba y laterales. La de abajo la gestiona el contenido
           desplazable para que pase por detrás de la barra de inicio. */
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Solo en modo app (añadida a pantalla de inicio): forzar la altura física completa */
      html.standalone #root {
        bottom: auto;
        height: var(--app-height, 100lvh);
      }
    </style>

    <script>
      (function () {
        var standalone =
          window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

        if (!standalone) return;
        document.documentElement.classList.add('standalone');

        function setAppHeight() {
          var h = window.innerHeight;
          if (window.screen) {
            // En modo app (pantalla de inicio) la web ocupa toda la pantalla física
            var landscape = window.innerWidth > window.innerHeight;
            var screenH = landscape
              ? Math.min(window.screen.width, window.screen.height)
              : Math.max(window.screen.width, window.screen.height);
            h = Math.max(h, screenH);
          }
          document.documentElement.style.setProperty('--app-height', h + 'px');
        }

        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('load', setAppHeight);
        window.addEventListener('pageshow', setAppHeight);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', function () {
          setTimeout(setAppHeight, 300);
        });
      })();
    </script>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
